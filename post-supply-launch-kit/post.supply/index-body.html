<style>
/* Layout: 1200px measure, 200px mono label column; tone bands, not boxes. One raised surface: the request card. */
:root{
  --ground:#F0EBE5;--band:#E7E3DA;--surface:#F8F7F3;--field:#EFEAE3;--field-focus:#FBFAF7;
  --ink:#1C1B19;--ink-2:#4A4740;--muted:#6B665E;--hair:#DCD6CE;
  --signal:#FF5A1F;--signal-text:#AD3D0B;--on-signal:#1C1B19;
  --inv-ground:#1C1B19;--inv-ink:#F0EBE5;--inv-muted:#CFC8BE;
  --ok:#1F8A4C;--ok-text:#17693A;--err:#C8352B;--err-text:#A12A22;
  --focus:rgba(28,27,25,.45);--scrim:rgba(28,27,25,.32);
  --shadow:0 1px 2px rgba(28,27,25,.06),0 8px 24px -12px rgba(28,27,25,.18);
  --sans:"Geist","Noto Sans SC","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --dur-fast:120ms;--dur-base:200ms;--dur-slow:360ms;--ease:cubic-bezier(.2,.8,.2,1);
  --measure:1200px;--label-col:200px;--r-sm:4px;--r-md:6px;--r-lg:8px;
  --gut-l:max(16px,env(safe-area-inset-left,0px));--gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:only light;
}
:root[data-theme="dark"]{
  --ground:#171716;--band:#1F1E1C;--surface:#232220;--field:#2B2A27;--field-focus:#302F2B;
  --ink:#F0EBE5;--ink-2:#CFC8BE;--muted:#A39C92;--hair:#34322F;
  --signal:#FF5A1F;--signal-text:#FF7A45;--on-signal:#1C1B19;
  --inv-ground:#0F0F0E;--inv-ink:#F0EBE5;--inv-muted:#CFC8BE;
  --ok:#3FB070;--ok-text:#62C98E;--err:#E5544A;--err-text:#F28A82;
  --focus:rgba(240,235,229,.55);--scrim:rgba(0,0,0,.5);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:only dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--ground);color:var(--ink);font:400 17px/1.6 var(--sans);overflow-x:clip;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ground)}
@media(min-width:1024px){body{font-size:18px}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:var(--r-sm)}
.wrap{max-width:calc(var(--measure) + 96px);margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}
@media(min-width:1024px){.wrap{padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:max(48px,env(safe-area-inset-right,0px))}}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ground);transition:box-shadow var(--dur-base) var(--ease)}
.hdr.scrolled{box-shadow:0 1px 0 var(--hair)}
.hdr .wrap{display:flex;align-items:center;gap:8px;height:64px;transition:height var(--dur-base) var(--ease)}
@media(min-width:1024px){.hdr .wrap{height:76px}.hdr.scrolled .wrap{height:60px}}
.logo{font-weight:700;font-size:22px;letter-spacing:-.035em;text-decoration:none;display:inline-flex;align-items:baseline;margin-right:auto;padding:8px 0;min-height:44px;align-items:center}
.logo i{display:inline-block;width:.24em;height:.24em;border-radius:50%;background:var(--signal);margin:0 .02em;transform:translateY(.33em)}
.nav{display:none;gap:4px}
.nav a{text-decoration:none;color:var(--ink-2);padding:10px 12px;border-radius:var(--r-sm);font-size:16px;transition:color var(--dur-fast)}
.nav a:hover{color:var(--ink)}
@media(min-width:1024px){.nav{display:flex;margin-right:auto}}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;height:44px;padding:0 10px;border:0;background:transparent;border-radius:var(--r-sm);color:var(--ink);transition:background var(--dur-fast)}
.icon-btn:hover{background:var(--band)}
.icon-btn:active{transform:scale(.96)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lang-btn{font-family:var(--mono);font-size:15px;letter-spacing:.02em}
.lang-btn svg{width:14px;height:14px;transition:transform var(--dur-base) var(--ease)}
.lang-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.hdr .hdr-cta{display:none;white-space:nowrap}
@media(min-width:1024px){.hdr .hdr-cta{display:inline-flex}.menu-btn{display:none}}
.theme-btn .sun{display:none}
:root[data-theme="dark"] .theme-btn .sun{display:block}
:root[data-theme="dark"] .theme-btn .moon{display:none}

/* Buttons */
.btn{position:relative;display:inline-flex;text-align:center;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 22px;border-radius:var(--r-sm);border:0;font-weight:600;font-size:17px;line-height:1;text-decoration:none;overflow:hidden;transition:transform var(--dur-fast) var(--ease),background var(--dur-base)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--signal);color:var(--on-signal)}
.btn-primary:hover{background:#FF6A33}
.btn-secondary{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.btn-secondary:hover{background:var(--band)}
.btn-block{width:100%}
.btn-sm{height:44px;font-size:16px;padding:0 16px}
.btn .arrow{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;transition:transform var(--dur-base) var(--ease)}
@media(hover:hover){.btn:hover .arrow{transform:translateX(4px)}}
.btn .load{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(28,27,25,.18);opacity:0}
.btn .load::after{content:"";position:absolute;inset:0;width:35%;background:var(--on-signal);transform:translateX(-100%)}
.btn.loading .load{opacity:1}
.btn.loading .load::after{animation:run 900ms var(--ease) infinite}
@keyframes run{to{transform:translateX(290%)}}

/* Sections */
section{padding-block:72px;border-top:1px solid var(--hair)}
@media(min-width:1024px){section{padding-block:128px}}
.band{background:var(--band);border-top-color:transparent}
.sec-grid{display:grid;gap:20px}
@media(min-width:1024px){.sec-grid{grid-template-columns:var(--label-col) 1fr;gap:48px}}
.label{font-family:var(--mono);font-size:13px;letter-spacing:.04em;color:var(--signal-text);display:flex;align-items:center;gap:10px;padding-top:8px}
.label::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--signal);flex:none}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.03em;text-wrap:balance}
h2{font-size:clamp(36px,7vw,60px);line-height:1.06}
.sub{color:var(--ink-2);margin:16px 0 0;max-width:60ch}

/* Hero */
.hero{border-top:0;padding-block:20px 64px}
@media(min-width:1024px){.hero{padding-block:72px 128px}}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:32px;align-items:start}
.hero-grid>*,.sec-grid>*,.calc>*,.why>*{min-width:0}
@media(min-width:1024px){.hero-grid{grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:64px}}
.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.04em;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--signal)}
.hero h1{font-size:clamp(44px,11.5vw,104px);line-height:.98;letter-spacing:-.04em;margin-top:20px}
.hero .lead{font-size:clamp(18px,2.2vw,21px);color:var(--ink-2);margin:20px 0 0;max-width:34ch}
@media(min-width:1024px){.hero .lead{max-width:40ch}.hero-copy{padding-top:24px}}
.proof{display:none;flex-wrap:wrap;gap:8px 20px;margin:28px 0 0;padding:0;list-style:none;font-family:var(--mono);font-size:13px;color:var(--muted)}
@media(min-width:1024px){.proof{display:flex}}
.proof li{display:flex;gap:8px;align-items:center}
.proof li::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--muted)}

/* Request card */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:24px 20px 20px;position:relative;scroll-margin-top:84px}
@media(min-width:600px){.card{padding:32px}}
.card-top{display:flex;align-items:center;gap:8px;min-height:44px;margin:-6px 0 6px}
.back{display:inline-flex;align-items:center;gap:4px;height:44px;margin-left:-12px;padding:0 12px;border:0;background:none;color:var(--ink-2);font-size:15px;border-radius:var(--r-sm);opacity:0;pointer-events:none;transition:opacity var(--dur-base)}
.back.show{opacity:1;pointer-events:auto}
.back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.step-label{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted);transition:color var(--dur-base)}
.step-label.done{color:var(--ok-text)}
.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:24px}
.progress span{height:4px;border-radius:2px;background:var(--hair);position:relative;overflow:hidden}
.progress span::after{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform 300ms var(--ease),background var(--dur-base)}
.progress span.cur::after{transform:scaleX(1)}
.progress span.ok::after{transform:scaleX(1);background:var(--ok)}
.viewport{position:relative;transition:height 260ms var(--ease)}
.step{display:grid;gap:20px}
.step[hidden]{display:none!important}
.step.out-l{animation:outL 160ms var(--ease) forwards}
.step.out-r{animation:outR 160ms var(--ease) forwards}
.step.in-r{animation:inR 220ms var(--ease) both}
.step.in-l{animation:inL 220ms var(--ease) both}
@keyframes outL{to{opacity:0;transform:translateX(-12px)}}
@keyframes outR{to{opacity:0;transform:translateX(12px)}}
@keyframes inR{from{opacity:0;transform:translateX(12px)}}
@keyframes inL{from{opacity:0;transform:translateX(-12px)}}
.step h3{font-size:24px;letter-spacing:-.02em;line-height:1.2}
.f{display:grid;gap:8px}
.f > label,.legend{font-weight:500;font-size:16px;color:var(--ink)}
.legend .opt{color:var(--muted);font-weight:400}
.ctl{position:relative;min-width:0;display:flex;align-items:center;background:var(--field);border-radius:var(--r-sm);transition:background var(--dur-base)}
.ctl::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--ink);transform:scaleX(0);transition:transform 180ms var(--ease),background var(--dur-base)}
.ctl:focus-within{background:var(--field-focus)}
.ctl:focus-within::after{transform:scaleX(1)}
.ctl.valid::after{transform:scaleX(1);background:var(--ok)}
.ctl.invalid::after{transform:scaleX(1);background:var(--err)}
.ctl input,.ctl select,.ctl textarea{flex:1;min-width:0;width:100%;height:56px;padding:0 16px;border:0;background:transparent;font-size:18px;border-radius:var(--r-sm);-webkit-appearance:none;appearance:none}
.ctl input:focus-visible,.ctl select:focus-visible,.ctl textarea:focus-visible{outline:none}
.ctl textarea{height:auto;min-height:104px;padding:14px 16px;resize:vertical;line-height:1.5}
.ctl select{padding-right:40px;cursor:pointer}
.ctl .chev{position:absolute;right:14px;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.8;pointer-events:none}
.ctl .tick{position:absolute;right:14px;width:18px;height:18px;opacity:0;transform:scale(.6);transition:opacity 160ms,transform 160ms var(--ease)}
.ctl .tick circle{fill:var(--ok)}.ctl .tick path{stroke:#fff;stroke-width:2;fill:none}
.ctl.valid .tick{opacity:1;transform:none}
.ctl.shake{animation:shake 220ms var(--ease)}
@keyframes shake{25%{transform:translateX(4px)}50%{transform:translateX(-4px)}75%{transform:translateX(3px)}}
.phone-row{display:grid;grid-template-columns:112px minmax(0,1fr);gap:8px}
.err{color:var(--err-text);font-size:15px;display:flex;gap:6px;align-items:center;animation:errIn 200ms var(--ease)}
.err svg{width:16px;height:16px;flex:none;stroke:var(--err);fill:none;stroke-width:2}
@keyframes errIn{from{opacity:0;transform:translateY(-4px)}}
.consent{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;cursor:pointer;padding:6px 0;font-size:15px;line-height:1.5;color:var(--ink-2)}
.consent input{position:absolute;opacity:0;width:24px;height:24px;margin:0}
.box{width:24px;height:24px;border-radius:6px;background:var(--field);box-shadow:inset 0 0 0 1.5px var(--muted);position:relative;overflow:hidden;transition:box-shadow var(--dur-base)}
.box::before{content:"";position:absolute;inset:0;background:var(--signal);clip-path:inset(0 100% 0 0);transition:clip-path 180ms var(--ease)}
.box svg{position:absolute;inset:3px;stroke:var(--on-signal);stroke-width:2.4;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset 180ms 80ms var(--ease)}
.consent input:checked + .box{box-shadow:none}
.consent input:checked + .box::before{clip-path:inset(0)}
.consent input:checked + .box svg{stroke-dashoffset:0}
.consent input:focus-visible + .box{outline:2px solid var(--focus);outline-offset:3px}
.consent.invalid .box{box-shadow:inset 0 0 0 1.5px var(--err)}
.fine{font-size:15px;color:var(--muted);text-align:center;margin:0}
.fine a,.copy-mail{color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--hair)}
.chips{display:flex;flex-wrap:wrap;gap:8px;border:0;padding:0;margin:0}
.chip{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:22px;border:0;background:var(--field);color:var(--ink);font-size:16px;transition:background var(--dur-base),color var(--dur-base),transform 80ms var(--ease)}
.chip:active{transform:scale(.97)}
.chip svg{width:0;height:16px;stroke:var(--on-signal);stroke-width:2.4;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:width 160ms var(--ease),stroke-dashoffset 160ms 60ms var(--ease)}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--signal);color:var(--on-signal)}
.chip[aria-pressed="true"] svg,.chip[aria-checked="true"] svg{width:16px;stroke-dashoffset:0}
.chips.invalid .chip{box-shadow:inset 0 0 0 1.5px var(--err)}
.disclose{justify-self:start;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0;border:0;background:none;color:var(--ink-2);font-size:16px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--hair)}
.disclose svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;transition:transform var(--dur-base) var(--ease)}
.disclose[aria-expanded="true"] svg{transform:rotate(45deg)}
.file{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;border-radius:var(--r-sm);background:var(--field);color:var(--ink-2);font-size:15px;cursor:pointer}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.file svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.file:focus-within{outline:2px solid var(--focus);outline-offset:3px}

/* Success */
.success{display:grid;gap:20px}
.success:focus{outline:none}
.mark{width:48px;height:48px}
.mark circle{fill:var(--ok);transform-origin:center;animation:pop 220ms var(--ease) both}
.mark path{stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:draw 360ms 180ms var(--ease) forwards}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
.success h3{font-size:28px;letter-spacing:-.025em;line-height:1.15}
.success p{margin:0;color:var(--ink-2)}
.summary{display:grid;margin:0}
.summary div{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--hair);font-size:15px}
.summary dt{color:var(--muted)}
.summary dd{margin:0;font-family:var(--mono);font-size:14px;word-break:break-word}
.next{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:15px;color:var(--ink-2)}
.next li{display:flex;gap:12px}
.next b{font-family:var(--mono);font-weight:400;color:var(--signal-text)}
.actions{display:grid;gap:8px}
.small{font-size:14px;color:var(--muted);margin:0}

/* How it works */
.steps3{list-style:none;margin:40px 0 0;padding:0;display:grid;gap:28px;position:relative}
@media(min-width:900px){.steps3{grid-template-columns:repeat(3,1fr);gap:40px;padding-top:28px}
.steps3::before,.steps3::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--hair)}
.steps3::after{background:var(--signal);transform:scaleX(0);transform-origin:left;transition:transform 1200ms var(--ease)}
.steps3.drawn::after{transform:scaleX(1)}}
.steps3 li{display:grid;gap:8px}
.num{font-family:var(--mono);font-size:13px;color:var(--signal-text)}
.steps3 h3{font-size:24px;letter-spacing:-.02em;line-height:1.25}
.steps3 p{margin:0;color:var(--ink-2)}

/* Products */
.rows{list-style:none;margin:40px 0 0;padding:0;border-bottom:1px solid var(--hair)}
.row{display:grid;grid-template-columns:36px 1fr;gap:4px 12px;padding:24px 0;border-top:1px solid var(--hair);position:relative;transition:background var(--dur-base)}
@media(min-width:900px){.row{grid-template-columns:56px 1fr 1.4fr auto;align-items:center;gap:24px;padding:28px 16px;margin:0 -16px;border-radius:var(--r-md)}
.row:hover{background:color-mix(in srgb,var(--ground) 60%,var(--surface))}}
.row .num{padding-top:6px}
.row h3{font-size:24px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.row h3::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--signal);transform:scale(0);transition:transform var(--dur-base) var(--ease)}
.row.sel h3::after{transform:scale(1)}
.row p{margin:0;color:var(--ink-2);grid-column:2}
@media(min-width:900px){.row p{grid-column:auto}}
.row .chip{grid-column:2;justify-self:start;margin-top:12px}
@media(min-width:900px){.row .chip{grid-column:auto;margin:0}}
.band .chip:not([aria-pressed="true"]){background:var(--surface)}

/* Why */
.why{display:grid;gap:40px;margin-top:40px}
@media(min-width:900px){.why{grid-template-columns:1fr 1fr;gap:64px}}
.statement{font-size:clamp(26px,3.6vw,40px);line-height:1.2;font-weight:500;letter-spacing:-.02em;margin:0;text-wrap:balance}
.ruled{list-style:none;margin:0;padding:0}
.ruled li{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:16px 0;border-top:1px solid var(--hair);color:var(--ink-2)}
.ruled li:first-child{border-top:0;padding-top:0}

/* Calculator band */

/* Closing */
.closing{background:var(--inv-ground);color:var(--inv-ink);border-top:0}
.closing .label{color:#FF7A45}
.closing h2{font-size:clamp(40px,8vw,84px);color:var(--inv-ink)}
.closing .sub{color:var(--inv-muted)}
.closing .btn{margin-top:32px}

/* Footer */
footer{padding-block:48px calc(48px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--hair)}
.foot{display:grid;gap:12px;font-size:15px;color:var(--muted)}
@media(min-width:900px){.foot{grid-template-columns:auto 1fr auto;align-items:center;gap:32px}}
.foot .logo{font-size:20px;color:var(--ink);margin:0}
.ref-note{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:24px}

/* Mobile sticky CTA */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:12px var(--gut-r) calc(12px + env(safe-area-inset-bottom,0px)) var(--gut-l);background:var(--ground);box-shadow:0 -1px 0 var(--hair);transform:translateY(110%);transition:transform 260ms var(--ease)}
.dock.show{transform:none}
@media(min-width:1024px){.dock{display:none}}

/* Sheets and menus */
.scrim{position:fixed;inset:0;z-index:70;background:var(--scrim);opacity:0;transition:opacity var(--dur-base)}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--surface);border-radius:12px 12px 0 0;padding:8px var(--gut-r) calc(16px + env(safe-area-inset-bottom,0px)) var(--gut-l);transform:translateY(100%);transition:transform 280ms var(--ease);max-height:88dvh;overflow:auto;touch-action:pan-y}
.sheet.show{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--hair);margin:4px auto 12px}
.sheet h2{font-size:15px;font-family:var(--mono);font-weight:400;letter-spacing:.04em;color:var(--muted);margin:0 0 8px}
.opt-list{list-style:none;margin:0;padding:0}
.opt-list button,.opt-list a{display:flex;align-items:center;width:100%;min-height:56px;padding:0 4px;border:0;border-top:1px solid var(--hair);background:none;text-align:left;font-size:18px;text-decoration:none;gap:12px}
.opt-list li:first-child > *{border-top:0}
.opt-list .code{margin-left:auto;font-family:var(--mono);font-size:14px;color:var(--muted)}
.opt-list .chk{width:20px;height:20px;flex:none;stroke:var(--signal-text);fill:none;stroke-width:2;opacity:0}
.opt-list [aria-current="true"] .chk{opacity:1}
.opt-list [aria-current="true"]{font-weight:600}
.sheet .btn{margin-top:16px}
.sheet .row-ctl{display:flex;justify-content:space-between;align-items:center;min-height:56px;border-top:1px solid var(--hair);font-size:18px}
@media(min-width:1024px){
  .sheet.lang{left:auto;right:auto;bottom:auto;top:0;width:280px;border-radius:var(--r-lg);box-shadow:var(--shadow);padding:8px 16px;transform:translateY(-6px);opacity:0;pointer-events:none;transition:transform 180ms var(--ease),opacity 180ms}
  .sheet.lang.show{transform:none;opacity:1;pointer-events:auto}
  .sheet.lang .grab,.sheet.lang h2{display:none}
  .scrim.light{background:transparent}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important;transition-delay:0ms!important}
  html{scroll-behavior:auto}
}

html.theme-fade body,html.theme-fade .hdr,html.theme-fade section,html.theme-fade .card{transition:background-color 600ms var(--ease),color 600ms var(--ease)}
html:not(.kbd) :focus-visible{outline:none!important}
html:not(.kbd) .consent input:focus-visible + .box{outline:none}
.legal{margin:-8px 0 0 36px;font-size:13px;line-height:1.5;color:var(--muted)}
.legal a{color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}

/* DDP preview card: the app itself, small */
.sec-grid{align-items:start}
.ddp-teaser{display:grid;grid-template-columns:minmax(0,1fr);gap:32px;align-items:start}
.ddp-teaser>*{min-width:0}
.mr label{min-width:0}.msel select{max-width:100%}
@media(min-width:900px){.ddp-teaser{grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:64px}}
.ddp-points{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:14px}
.ddp-points li{display:grid;gap:2px;padding-left:20px;position:relative}
.ddp-points li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:8px;border-radius:50%;background:var(--signal)}
.ddp-points b{font-weight:600}
.ddp-points span{color:var(--ink-2)}
.ddp-card{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:16px}
.ddp-card-hd{display:flex;align-items:center;gap:10px;margin:2px 2px 14px}
.ddp-card-hd .ic{width:32px;height:32px;border-radius:8px;background:var(--ink);display:grid;place-items:center}
.ddp-card-hd .ic i{width:10px;height:10px;border-radius:50%;background:var(--signal)}
.ddp-card-hd b{display:block;font-size:16px}.ddp-card-hd small{font-family:var(--mono);font-size:12px;color:var(--muted)}
.mgroup{border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--hair);overflow:hidden;background:var(--surface)}
.mr{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 14px}
.mr + .mr{border-top:1px solid var(--hair)}
.mr label{flex:1;font-size:16px}
.msel{position:relative}.msel select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font:16px var(--sans);color:var(--ink-2);padding:0 22px 0 0;height:44px;text-align:right;text-align-last:right;cursor:pointer}
.msel svg{position:absolute;right:0;top:14px;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;pointer-events:none}
.mval{display:flex;align-items:center;gap:2px;height:44px;padding:0 12px;border-radius:var(--r-sm);background:var(--field);font-family:var(--mono);font-size:18px}
.mval span{color:var(--muted)}.mval input{width:6ch;border:0;background:transparent;font:inherit;text-align:right;color:var(--ink);caret-color:var(--signal)}
.mval input:focus{outline:none}.mval:focus-within{box-shadow:inset 0 0 0 1.5px var(--ink);background:var(--field-focus)}
.m-k{margin:18px 2px 0;font-size:14px;color:var(--muted)}
.m-big{margin:2px 2px 0;display:flex;align-items:baseline;gap:10px;font-family:var(--mono);font-size:48px;line-height:1.05;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.delta{font-family:var(--mono);font-size:13px;letter-spacing:0;padding:3px 8px;border-radius:12px;opacity:0;transform:translateY(4px);transition:opacity 200ms,transform 200ms var(--ease)}
.delta.show{opacity:1;transform:none}.delta.down{color:var(--ok-text);background:color-mix(in srgb,var(--ok) 14%,transparent)}.delta.up{color:var(--ink-2);background:var(--field)}
.ddp-card .bar{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;margin:14px 2px 6px;background:var(--hair)}
.ddp-card .bar i{display:block;flex:0 0 auto;transition:flex-grow 400ms var(--ease)}
.s-g{background:var(--ink)}.s-f{background:var(--ink-2)}.s-d{background:var(--signal)}.s-l{background:var(--muted)}.s-t{background:var(--hair);background-image:repeating-linear-gradient(135deg,var(--muted) 0 1px,transparent 1px 5px)}
.m-lines{list-style:none;margin:6px 2px 0;padding:0}
.m-lines li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--hair);font-size:15px;color:var(--ink-2)}
.m-lines li span:last-child{font-family:var(--mono);color:var(--ink)}
.m-note{margin:10px 2px 14px;font-size:13px;line-height:1.45;color:var(--muted)}

.queued{margin:0;padding:12px 14px;border-radius:var(--r-sm);background:var(--field);font-size:15px;color:var(--ink-2)}

  var tax=r.tax?(r.tb==="FOB"?goods:cif+duty+fees)*r.rate/100:0,local=MDEF.broker+MDEF.port+MDEF.inland,total=cif+duty+fees+tax+local;

/* Header compression, dock, how-it-works line */
var hdr=$("#hdr"),cardIn=true,closingIn=false;
function dockUpdate(){$("#dock").classList.toggle("show",S.step===1&&!cardIn&&!closingIn&&window.scrollY>200)}
if("IntersectionObserver" in window){
  cardIn=true;closingIn=false;
  new IntersectionObserver(function(es){es.forEach(function(e){if(e.target.id==="request")cardIn=e.isIntersecting;else closingIn=e.isIntersecting});dockUpdate()},{threshold:0}).observe($("#request"));
  new IntersectionObserver(function(es){closingIn=es[0].isIntersecting;dockUpdate()}).observe($("#start"));
  new IntersectionObserver(function(es,o){if(es[0].isIntersecting){$("#steps3").classList.add("drawn");o.disconnect()}},{threshold:.4}).observe($("#steps3"));
}else $("#steps3").classList.add("drawn");
window.addEventListener("scroll",function(){hdr.classList.toggle("scrolled",window.scrollY>80)},{passive:true});

render();
requestAnimationFrame(function(){vp.style.height=stepEl(S.step).offsetHeight+"px"});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(sizeVP);
})();
</script>
